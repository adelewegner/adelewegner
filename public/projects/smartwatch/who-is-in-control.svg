<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 630" width="740" height="630">
  <!-- The question the project ends on: a pair of scales with the watch on
       one side and a heart on the other, and a question mark above. -->
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <g id="art" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- question mark -->
      <path d="M332 92 C332 56 408 52 408 92 C408 120 370 122 370 152"/>
      <circle cx="370" cy="180" r="4"/>
      <!-- stand -->
      <path d="M370 214 L370 540"/>
      <path d="M290 556 Q290 540 306 540 L434 540 Q450 540 450 556 L450 566 L290 566 Z"/>
      <circle cx="370" cy="226" r="10"/>
      <!-- beam, tipped towards the watch -->
      <path d="M150 260 L590 200"/>
      <!-- left strings and pan with the watch -->
      <path d="M150 260 L100 380 M150 260 L200 380"/>
      <path d="M86 380 Q150 430 214 380 Z"/>
      <path d="M128 316 L128 296 L172 296 L172 316 M128 364 L128 380 M172 364 L172 380"/>
      <circle cx="150" cy="340" r="26"/>
      <path d="M150 326 L150 340 L160 346"/>
      <!-- right strings and pan with the heart -->
      <path d="M590 200 L540 320 M590 200 L640 320"/>
      <path d="M526 320 Q590 370 654 320 Z"/>
      <path d="M590 312 C558 290 556 260 578 258 C588 257 590 266 590 272 C590 266 592 257 602 258 C624 260 622 290 590 312 Z"/>
    </g>
  </defs>
  <rect width="740" height="630" fill="#cfe3f3"/>
  <g filter="url(#rough)">
    <use xlink:href="#art" href="#art" stroke="#8fa3b5" transform="translate(3 4)"/>
    <use xlink:href="#art" href="#art" stroke="#1d1d1d"/>
  </g>
</svg>
